name: Android APK va AAB yasash

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Kodni yuklash
        uses: actions/checkout@v4

      - name: Node.js o'rnatish
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Java JDK 21 o'rnatish
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Paketslarni o'rnatish va yig'ish
        run: |
          npm install
          npx vite build
          npx cap sync android

      - name: APK va AAB fayllarini tayyorlash
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug bundleRelease

      - name: Tayyor APK faylni saqlash
        uses: actions/upload-artifact@v4
        with:
          name: Kunlik-Reja-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk

      - name: Play Market AAB faylni saqlash
        uses: actions/upload-artifact@v4
        with:
          name: Kunlik-Reja-PlayMarket-AAB
          path: android/app/build/outputs/bundle/release/app-release.aab
